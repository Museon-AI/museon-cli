[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "museoncli"
version = "0.5.20"
description = "Agent-ready CLI for Museon's social media operating platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Museon" }]
keywords = ["ai-agent", "cli", "social-media", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "pyyaml>=6.0.2",
  "socksio>=1.0.0",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
museoncli = "museoncli.main:main"
museon = "museoncli.main:main"

[project.urls]
Homepage = "https://www.museon.ai/cli"
Repository = "https://github.com/Museon-AI/museon-cli"
Issues = "https://github.com/Museon-AI/museon-cli/issues"
Documentation = "https://github.com/Museon-AI/museon-cli#readme"

[dependency-groups]
dev = [
  "jsonschema>=4.23.0",
  "pytest>=8.2.0",
  "ruff>=0.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["museoncli"]

[tool.hatch.build.targets.wheel.force-include]
"skills/museon-research" = "museoncli/bundled_skills/museon-research"
"skills/museon-content-workflow-base" = "museoncli/bundled_skills/museon-content-workflow-base"
"skills/museon-content-workflow-assets" = "museoncli/bundled_skills/museon-content-workflow-assets"
"skills/museon-content-workflow-generation" = "museoncli/bundled_skills/museon-content-workflow-generation"
"skills/museon-content-workflow-social-account" = "museoncli/bundled_skills/museon-content-workflow-social-account"
"skills/museon-content-workflow-account-publish" = "museoncli/bundled_skills/museon-content-workflow-account-publish"
"skills/museon-content-workflow-campaign-monitor" = "museoncli/bundled_skills/museon-content-workflow-campaign-monitor"
"skills/museon-content-workflow-routines" = "museoncli/bundled_skills/museon-content-workflow-routines"
"skills/museon-content-workflow-artifacts" = "museoncli/bundled_skills/museon-content-workflow-artifacts"
"skills/museon-content-workflow-agentic-campaign" = "museoncli/bundled_skills/museon-content-workflow-agentic-campaign"
"skills/museon-content-workflow-evaluator" = "museoncli/bundled_skills/museon-content-workflow-evaluator"
"skills/social-media-hook-analyze" = "museoncli/bundled_skills/social-media-hook-analyze"

[tool.ruff]
line-length = 100
target-version = "py311"
