# Museon CLI task index: which command to use for a job, in which order.
#
# Hand-written. Each task's steps name catalog commands by capability key
# (`museoncli schema <key>`) or a built-in (`auth start`, `org select`, ...), each with
# a one-line gotcha. Usage lines, risk and summaries come from the registry, never from
# here. scripts/gen_task_index.py renders this file into the Agent Skill reference,
# docs/guide.md and docs/llms.txt; tests/test_task_index.py fails when a step names a
# command that does not exist, or a new command sits in no task and is not unlisted.
#
# A step is `- <command>` or `- <command>: "<gotcha>"`.

intro: >-
  Museon CLI runs MuseOn's social-media operations from an Agent: UGC Campaigns (set up,
  recruit, approve, contract, daily tasks, content review, counting, client reports),
  content tracking Campaigns, analytics boards, social accounts and publishing, AI image
  posts, research and the organization. Find the task below, then run its commands in
  order. Every command prints one JSON envelope; reads change nothing; a write that
  reaches someone outside the organization or cannot be undone needs --yes, which only
  the user may give.

llms_summary: >-
  Museon CLI (`museoncli`) is the agent-ready command line for MuseOn, a social-media
  operating platform for UGC creator Campaigns, content tracking, analytics, social
  accounts, publishing and research; this index maps tasks to the exact commands.

topics:
  - id: ids
    title: Which id goes where
    body: |
      - A Campaign has one id, whichever kind it is (UGC or tracking): the `id` of `museoncli campaign +list`. Every command that addresses a Campaign takes it as `--campaign-id`: `campaign`, `ugc` and `analytics board` alike.
      - Inside a Campaign, `--id` is the entity the command acts on and the Campaign is `--campaign-id`: `ugc enrollment +approve --campaign-id <campaign> --id <enrollment>`, `ugc assignment +withdraw --campaign-id <campaign> --id <assignment>`. Other children are qualified (`campaign content +remove --collection-content-id`, `campaign video +get --content-id`).
      - An enrollment id (`ugc enrollment +list`) is one creator's place in one Campaign: approve, message, nudge, persona and payscale take it. A creative id is one video (`ugc creative +list`, `campaign video +list`); a content id is one post on one platform; a collection-content id is one post's place in one Campaign (`campaign content +list`).
      - A task id comes from `ugc task +list`; its `actions` list what `ugc task +run-action --action` accepts.
      - Every id is a UUID; the CLI rejects placeholders before any request.
  - id: creator-ids
    title: The three creator ids
    body: |
      - **UGC creator** (a person, `ugc_creator_id`): `ugc creator +list`/`+get --id`; `campaign content +list --ugc-creator-id`; `--creator-id` on `campaign video +list`, `campaign settlement +get` and `ugc enrollment +list`.
      - **Social account** (one handle on one platform, `creator_social_account_id` from `campaign creator +list`): `--creator-id` on every `campaign creator` command (`+get`, `+get-performance`, `+add`, `+remove`), `campaign post +list` and `campaign content +list`. A post on its own is `--content-id` (`campaign post +get`, `+get-performance`); the old `--id` on those reads still answers with a deprecation warning. A social account's `creator_info.creator_id` is unrelated: never read the person from it or from a handle.
      - **Enrollment** (the person in one Campaign): what every `ugc enrollment`/`message` write takes.
      - The same flag name `--creator-id` means a person on some commands and a social account on others: read the flag's help (`<command> --help`) before passing it.
  - id: campaign-kinds
    title: The kinds of campaign
    body: |
      - **UGC Campaign** (`campaign +create --type ugc`): creators apply, sign a contract, post against Formats (脚本, `brief` in commands) and are paid by payscales. Run by the operating team's organization; its creator work is `ugc`.
      - **Content tracking Campaign** (`campaign +create --type tracking`): no applications or review; you add creators and posts (`campaign creator +add`, `campaign content +add`) and read their performance.
      - Both kinds are listed, created, launched, set up and read the same way, with `campaign` (`campaign +list --type ugc|tracking`).
      - **Agentic Creative Campaign** (`agentic-campaign`): MuseOn keeps publishing AI image posts on chosen accounts by persona Plans. Separate ids, its own lifecycle.
      - HireAICreator plans and test groups (`hireaicreator`) are a separate product with their own Skill.
  - id: confirmation
    title: Dry run, --yes and confirmation_required
    body: |
      - Every write takes `--dry-run`. On `ugc` and most newer commands the dry run reads the live state and shows what would change; elsewhere it validates and echoes the input. Nothing is written.
      - A command that reaches someone outside the organization (messages, nudges, invitations, broadcasts, client reports, review verdicts) or cannot be undone needs `--yes`. Without it the CLI answers `ok: false, reason: confirmation_required` (exit 1) and, where it can, `preview`. Show the user the preview, ask, and only then rerun the same command with `--yes`. Never add `--yes` on your own.
      - Plain writes (claim, comment, due date, persona, counting, settings) run without `--yes`; still dry-run first unless the user already decided exactly this change.
      - `museoncli guide <task>` marks each step `read`, `write` or `destructive`, and `needs_yes`.
  - id: safe-writes
    title: Conflicts, retries and async work
    body: |
      - Compare-and-set: many writes send the version, status or `updated_at` they read (`--expected-version`, `--expected-status`, `--expected-updated-at`). A `conflict` means someone changed it since: read again, show the user, ask again. Never retry blindly.
      - Idempotency: creates, messages and batch jobs return or take an `--idempotency-key`. After a timeout or unknown outcome, rerun with the same key and the same input; a new key does it twice.
      - Async work returns a handle (task id, job id, batch id) and a matching `+get` command. A receipt is not completion: read the status until it is terminal, and use the returned wakeup delay instead of inventing one.
      - A write is done only when its read-back says so (`+list`/`+get` of the same object).
  - id: organizations
    title: Organizations, roles and who may do what
    body: |
      - Every command acts in the selected organization (`museoncli org current`; change it with `museoncli org select --id <organization-id>`). `--organization-id <id>` addresses another organization for one call. Envelopes name it in `organization`.
      - There is no workspace: no `workspace` command, no `--workspace-id`, except in `agentic-campaign` and `hireaicreator`.
      - Your role in the organization (owner, admin, operator, member) and its Campaign scope decide what you see and change. UGC operations (approve, message, review, setup, client reports) belong to the Campaign's operating team: owner, admin, or an operator on that Campaign. A member reads.
      - The server decides. A refusal is `not_found` or `forbidden`: tell the user this login cannot do it; never retry under another identity or organization.
  - id: failures
    title: When a command fails
    body: |
      - Branch on `error.code` (same as `reason`), `error.server_code` and `error.retryable`; `error.hint` names the help to read on a usage error.
      - `missing_auth` / `unauthorized`: run `museoncli auth start`, show the link, `museoncli auth finish --wait`, then resume. `missing_organization`: `museoncli org list`, `museoncli org select`.
      - Exit codes: 0 ok, 1 failure, 2 usage, 3 not found, 4 authentication, 5 conflict.
      - A read that lists pages: add `--all` and check `page_info.complete`, or follow `next_cursor` with `--cursor`.
  - id: which-one
    title: Which of two similar commands to use
    rows:
      - need: "A UGC Campaign's roster to act on (approve, assign, message, persona)"
        use: ugc.enrollment-list
        not: [campaign.roster-list]
        why: "ugc enrollment +list returns the enrollment ids ugc writes take (--detail adds contract and Discord state); campaign roster +list is the By Creator tab's figures."
      - need: "Creators of a UGC Campaign with their post figures"
        use: campaign.roster-list
        not: [ugc.enrollment-list, campaign.creator-list]
        why: "roster +list is the By Creator tab; campaign creator +list lists the social accounts a Campaign covers, the tracking Campaign view."
      - need: "One creator (a person) and their Campaigns"
        use: ugc.creator-get
        not: [campaign.creator-get]
        why: "campaign creator +get reads one social account by its social account id."
      - need: "A UGC Campaign's videos and their review state"
        use: campaign.video-list
        not: [campaign.content-list, ugc.creative-list]
        why: "video +list is the Content tab (each video once); campaign content +list lists every post with attribution and is the one for tracking Campaigns; ugc creative +list is the brief view for assigning Formats."
      - need: "Approve or reject an application"
        use: ugc.enrollment-approve
        not: [ugc.task-run-action]
        why: "Same effect. Working from the Tasks queue, press the task's own approve/reject with task +run-action; otherwise use enrollment +approve/+reject."
      - need: "Approve or reject a video"
        use: ugc.creative-review
        not: [ugc.task-run-action]
        why: "Same effect; from a review task use task +run-action --action approve|reject."
      - need: "Write to one creator"
        use: ugc.message-send
        not: [ugc.broadcast-create, ugc.enrollment-nudge]
        why: "A broadcast goes to many on Discord; a nudge is the fixed reminder for one check."
      - need: "Daily trend and KPI tiles"
        use: campaign.get-summary
        not: [campaign.get-period-performance]
        why: "+get-period-performance compares a period with the one before it."
      - need: "Figures over several Campaigns"
        use: analytics.board-get-data
        not: [campaign.analytics-get]
        why: "A board reads the Campaigns it holds; campaign analytics +get is every UGC Campaign of the operating organization."
      - need: "Publish ready video files or photo sets"
        use: publish.post-schedule
        not: [ai-slideshow.publish-create-schedule, hireaicreator.delivery-share]
        why: "ai-slideshow publish schedules slideshow accounts; hireaicreator delivery shares HireAICreator videos."
      - need: "A UGC Format (脚本)"
        use: ugc.brief-list
        not: [ai-slideshow.asset-list, hireaicreator.format-list]
        why: "ai-slideshow asset --type format and hireaicreator format are different products' formats."
      - need: "A UGC persona (creator type)"
        use: ugc.persona-list
        not: [ai-slideshow.asset-list, hireaicreator.persona-list]
        why: "ai-slideshow asset --type persona is a slideshow voice; hireaicreator persona an AI creator."
      - need: "Generate one image or video from a prompt"
        use: media.generate
        not: [ai-slideshow.generation-create]
        why: "ai-slideshow generation +create builds an image post from format, topic and persona assets."
  - id: renamed
    title: Renamed commands
    aliases: true
    body: |
      Old command names keep answering, print a deprecation warning and will be removed. Use the new name.

chapters:
  # ---------------------------------------------------------------------------
  - id: start
    title: "0. Start here"
    summary: >-
      Sign in, choose the organization, find a command, keep the CLI and its Skills current.
      Read the topics on ids and on the confirmation rule before your first write.
    see: [ids, confirmation, organizations, which-one]
    tasks:
      - id: login
        title: Sign in
        when: ["log in", "login", "sign in", "authenticate", "missing_auth", "unauthorized", "登录", "授权", "认证"]
        steps:
          - auth start: "Show the user verification_uri_complete; they approve in the browser."
          - auth finish: "--wait polls until approved (five minutes by default)."
          - auth status
          - auth logout: "Only when the user asks to sign out."
      - id: choose-organization
        title: Choose the organization to act in
        when: ["organization", "switch organization", "select org", "missing_organization", "which org", "组织", "切换组织", "选组织"]
        steps:
          - whoami: "The organizations this login can act in."
          - org list
          - org select: "Every later command acts there; --organization-id overrides it for one call."
          - org current
        see: [organizations]
      - id: find-a-command
        title: Find the command for a job
        when: ["which command", "how do I", "find command", "help", "schema", "用什么命令", "怎么做", "命令"]
        steps:
          - guide: "No argument: chapters and tasks; a task id: its steps; --search: tasks and commands for the user's words."
          - schema: "schema <command> for one command's inputs; --compact --search <words> for a short ranked list."
        see: [which-one, renamed]
      - id: keep-cli-current
        title: Check the version, upgrade, install the Skills
        when: ["version", "upgrade", "update cli", "install skills", "setup", "版本", "升级", "安装技能"]
        steps:
          - version: "update_status and upgrade_command say whether and how to upgrade."
          - upgrade: "Only when the user agrees; a uv tool install upgrades itself."
          - setup: "Installs the bundled Agent Skills; the host Agent then needs a restart."

  # ---------------------------------------------------------------------------
  - id: ugc
    title: "1. Run a UGC Campaign"
    summary: >-
      A UGC Campaign in the order the work happens: create and set it up, recruit, approve
      applications, contract, run the day's tasks and messages, review content, decide what
      counts, report to the client and read settlement. The Campaign itself (create, launch,
      settings) is `campaign`; the work with its creators is `ugc`. Both take the Campaign id
      from `campaign +list` as --campaign-id.
    see: [ids, creator-ids, confirmation, safe-writes, organizations]
    tasks:
      - id: find-campaign
        title: Find a Campaign and its id
        when: ["find campaign", "campaign id", "list campaigns", "which campaign", "找活动", "活动列表", "campaign 列表"]
        steps:
          - campaign.list: "Both kinds, own and shared-in; --type ugc|tracking, --status, --search narrow it. Its id is every --campaign-id."
          - campaign.get: "One Campaign's header (type, status, start day) and tracking record."
      - id: ugc-create-campaign
        title: Create and set up a UGC Campaign
        when: ["create campaign", "new campaign", "set up campaign", "campaign setup", "launch campaign", "新建活动", "创建活动", "活动设置", "上线活动"]
        before: Dry-run each write, show the user, then write. A UGC Campaign can be created only in the operating team's organization.
        steps:
          - campaign.create: "--type ugc; data.campaign.id is the new --campaign-id. Rerun an unknown outcome with the returned idempotency key."
          - campaign.settings-update: "Approval and join mode, budget cap, platforms, languages, rules; only the fields passed change."
          - campaign.staff-set: "PMs (--manager-user-id) and OPs (--operator-user-id); user ids from organization member +list."
          - ugc.delivery-target-create: "A target's dates are its own window; they never move the Campaign's start day."
          - ugc.contract-template-set: "--source default or custom; the dry run returns the filled preview."
          - ugc.payscale-create: "The default payscale exists already; add custom ones only when creators are paid differently."
          - ugc.pay-rate-create: "A video-content rate needs a description; lifetime-views needs min_creator_views."
          - ugc.discord-server-initialize: "Builds onboarding channels and roles in a server the MuseOn bot is already in."
          - ugc.brief-create: "Or link library Formats with ugc brief +link (task ugc-formats)."
          - campaign.setup-get: "Read everything back; sections you may not read are listed under unavailable."
          - campaign.launch: "Dry run first: launchability.ok and reasons; then run it with --expected-status draft."
        see: [ugc-formats, ugc-recruit]
      - id: ugc-read-setup
        title: Read how a Campaign is configured
        when: ["campaign settings", "budget", "approval mode", "contract template", "payscale", "staff", "discord server", "dm rules", "活动配置", "预算", "价格", "合同模板", "设置页"]
        steps:
          - campaign.setup-get: "Everything the setup page reads; --section narrows it."
          - campaign.settings-get: "Type, status, settings, product, readiness, briefs."
          - campaign.staff-list
          - ugc.delivery-target-list
          - ugc.payscale-list
          - ugc.contract-template-get
          - ugc.discord-server-get
          - ugc.dm-rule-list
          - ugc.dm-automation-list
      - id: ugc-change-setup
        title: Change a Campaign's settings, team, targets, payscales or Discord
        when: ["change settings", "edit campaign", "budget cap", "change payscale", "pay rate", "delivery target", "discord", "修改设置", "改预算", "改价格", "目标"]
        steps:
          - campaign.settings-update: "Writes the whole settings object back with only your fields changed; brand editors may not change the team's settings."
          - campaign.staff-set: "A role not passed keeps its people; --no-managers / --no-operators empties it."
          - ugc.delivery-target-update: "'none' clears a figure or date."
          - ugc.delivery-target-delete
          - ugc.payscale-update
          - ugc.payscale-delete: "Only a payscale nobody is on."
          - ugc.pay-rate-update: "The fields in --rate-json change; the rate's kind never does."
          - ugc.pay-rate-delete
          - ugc.contract-template-set
          - ugc.discord-server-set: "An existing server layout: --guild-id plus the welcome, help and review channels."
          - ugc.discord-server-remove: "Channels and roles stay in Discord."
      - id: ugc-lifecycle
        title: Launch, pause, resume, end, archive or rename a Campaign
        when: ["launch", "pause campaign", "resume campaign", "end campaign", "complete", "archive", "restore", "rename", "暂停活动", "结束活动", "归档", "恢复", "改名"]
        steps:
          - campaign.launch: "Draft → active; a UGC one opens its apply link."
          - campaign.pause
          - campaign.resume
          - campaign.complete: "Cannot reopen; creators' accounts are released."
          - campaign.archive: "Draft or completed only; +restore brings it back."
          - campaign.restore: "Back to the status it was archived from."
          - campaign.rename
      - id: ugc-formats
        title: Write and link Formats (脚本, brief)
        when: ["format", "brief", "script", "脚本", "brief library", "格式", "写脚本", "脚本库", "link brief"]
        before: In commands the UGC Format is `brief`. Editing a library Format reaches every Campaign that uses it; tell the user which before they confirm.
        steps:
          - ugc.brief-library-list: "The organization's library; --status archived shows archived ones."
          - ugc.brief-library-get: "Current version, the editable document, which Campaigns use it."
          - ugc.brief-library-create: "A library Format, used by no Campaign until linked."
          - ugc.brief-library-update: "A new version; pass --expected-version from your read."
          - ugc.brief-library-copy
          - ugc.brief-library-archive: "No restore exists."
          - ugc.brief-list: "The Formats one Campaign links."
          - ugc.brief-get
          - ugc.brief-create: "Writes a Format inside the Campaign, linked at once; optional --persona-id."
          - ugc.brief-link: "Use a library Format here; --replaces swaps out one already linked."
          - ugc.brief-copy: "Copy a Format version into the Campaign for another persona."
          - ugc.brief-update: "Edits the Campaign's Format as a new version; ask whether to --notify creators working on it."
          - ugc.brief-upload-media: "Upload a reference file, then add it to --references-json of +update."
          - ugc.brief-unlink: "The Format stays in the library."
      - id: ugc-personas
        title: Manage UGC personas (creator types)
        when: ["persona", "creator type", "人设", "达人类型", "persona list"]
        steps:
          - ugc.persona-list: "Not ai-slideshow personas."
          - ugc.persona-create: "Titles are unique."
          - ugc.persona-update
          - ugc.persona-delete: "Only one nothing names any more."
          - ugc.enrollment-set-persona: "Give enrollments a persona (up to 200, all or nothing)."
      - id: ugc-assign-formats
        title: Assign Formats to creators and link videos to Formats
        when: ["assign brief", "assignment", "who owes a video", "brief progress", "creative without brief", "分配脚本", "派单", "进度", "没有脚本的视频"]
        steps:
          - ugc.enrollment-list: "--status participating: the enrollment ids to assign."
          - ugc.brief-progress: "Raw counts per brief and assignment; report them, never judge who owes a video."
          - ugc.assignment-list: "The Operations tab's assignments and what is due."
          - ugc.assignment-create: "One brief to one or more enrollments, with video limit, due time, note, priority."
          - ugc.assignment-update-terms: "Saving sends the creator one updated brief."
          - ugc.assignment-withdraw: "The creator no longer has the brief."
          - ugc.creative-list: "--brief-id none: videos that cite no Format yet."
          - ugc.creative-set-brief: "A video delivered against an assignment keeps that assignment's brief."
          - ugc.creative-apply-default-briefs: "Links each brief-less video whose creator has exactly one live assignment."
      - id: ugc-recruit
        title: Recruit creators (links, invitations, Discord, Comment-to-DM)
        when: ["recruit", "recruitment link", "sign-up link", "invite", "invitation", "apply link", "comment to dm", "dm rule", "招募", "招募链接", "邀请", "报名链接", "评论私信"]
        steps:
          - ugc.recruit-link-list: "The discover link comes back as discovery."
          - ugc.recruit-link-create: "An invite link with its own code, roster group, payscale and approval rule, or --kind discover."
          - ugc.recruit-link-update: "Settings not passed keep their value."
          - ugc.recruit-link-revoke: "Stops working at once."
          - ugc.invitation-list
          - ugc.invitation-create: "MuseOn emails the creator; the preview flags an open invitation to the same address: resend that one instead."
          - ugc.invitation-resend
          - ugc.invitation-revoke
          - ugc.discord-server-get: "Recruits join through the Campaign's Discord server."
          - ugc.dm-rule-create: "One open rule per Campaign; an active rule DMs commenters."
          - ugc.dm-rule-update: "--status paused stops it, active resumes it, archived ends it."
      - id: ugc-approve-applications
        title: Approve or reject applications and onboard creators
        when: ["approve application", "reject application", "pending creators", "admit", "onboarding", "trial", "审批", "审批报名", "批准", "审核报名", "通过报名", "拒绝报名", "入驻", "试用"]
        before: Applications wait in the onboarding queue. The task's own approve/reject and the enrollment commands have the same effect.
        steps:
          - ugc.task-list: "--queue onboarding --actor operator: what waits on the team."
          - ugc.enrollment-list: "--status pending: the applications."
          - ugc.task-run-action: "--action approve|reject from the review task; --fields-json {\"payscale_id\": ...} approves on another payscale."
          - ugc.enrollment-approve: "The direct route: the creator is told and gets the contract."
          - ugc.enrollment-reject: "--note is written to the creator; --ban also bans them. No command reopens it: the creator reapplies."
          - ugc.enrollment-admit: "Admit an onboarding creator by hand (only a signed contract is required); --note records why."
          - ugc.enrollment-set-persona
          - ugc.enrollment-set-payscale: "Compare-and-set on the enrollment's updated_at."
          - ugc.enrollment-graduate-trial: "Refused while the trial lists graduate blockers."
      - id: ugc-contract
        title: Send, check or resend a creator's contract
        when: ["contract", "sign", "not signed", "resend contract", "terminate contract", "合同", "签约", "没签", "重发合同"]
        steps:
          - ugc.contract-template-get: "The Campaign's template and signing parties."
          - ugc.enrollment-get-contract: "One enrollment's contract: draft, sent, signed or terminated."
          - ugc.task-run-action: "A contract task's send / mark-signed / terminate."
          - ugc.message-resend-card: "--kind contract-card; the preview lists earlier deliveries."
          - ugc.enrollment-nudge: "--check not-signed reminds the creator in Discord (once a day)."
      - id: ugc-manage-roster
        title: Pause, resume or remove creators
        when: ["pause creator", "resume creator", "remove creator", "kick", "roster", "暂停达人", "恢复达人", "移除达人", "踢出"]
        steps:
          - ugc.enrollment-list
          - ugc.enrollment-pause: "Their posts are not collected or settled until resumed."
          - ugc.enrollment-resume
          - ugc.enrollment-remove: "Up to 1000 (repeat --id), compare-and-set on each."
      - id: ugc-daily-tasks
        title: Work through today's tasks
        when: ["tasks", "todo", "what needs doing", "task queue", "claim task", "today", "任务", "待办", "今天做什么", "认领"]
        steps:
          - ugc.task-summary-get: "Open counts per queue, what waits on you versus others."
          - ugc.task-list: "--queue media|onboarding|creators|posts|viral|invites|client-reports|all --actor operator."
          - ugc.task-get: "Its actions, context and history; actions are what +run-action accepts."
          - ugc.task-claim: "So teammates see you are on it."
          - ugc.task-run-action: "Press one of the task's own buttons; inputs other than --comments go in --fields-json."
          - ugc.task-comment: "The team sees it; the creator does not."
          - ugc.task-set-due: "--due-at none clears it; compare-and-set on updated_at."
          - ugc.task-set-assignees: "At most 20 members; --unassign clears."
          - ugc.task-defer-reminder: "30 minutes the first time a day; later ones need --remind-at and --reason."
          - ugc.task-release
      - id: ugc-message-creator
        title: Read and send messages to a creator
        when: ["message creator", "dm creator", "conversation", "reply to creator", "send message", "retry message", "私信达人", "发消息", "回复达人", "聊天记录"]
        steps:
          - ugc.message-list: "The conversation with one enrolled creator, newest first."
          - ugc.message-send: "--enrollment-id: their project page; --campaign-id with --creative-id: about one video, pushed to Discord. Keep the returned idempotency_key for a retry."
          - ugc.message-retry: "--id is the failed delivery's intent_id from the message ledger."
