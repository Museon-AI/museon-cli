          - agentic-campaign.plan-create: "Only in setup; --persona-id."
          - agentic-campaign.plan-supply-update: "The complete paired supply with the latest Plan version; opens a proposal, does not publish."
          - agentic-campaign.proposal-list
          - agentic-campaign.proposal-get
          - agentic-campaign.schedule-rollout-preflight: "Always before confirming a proposal."
          - agentic-campaign.confirm-schedule-rollout: "Caller-owned idempotency key."
          - agentic-campaign.schedule-rollout-get
          - agentic-campaign.plan-members-reconcile: "Admit only the named accounts."
          - agentic-campaign.plan-account-control: "--action enable per account after reading +plan-get."
          - agentic-campaign.plan-posts: "Missing metrics are not zero."
          - agentic-campaign.proposal-withdraw
      - id: managed-publishing-maintain
        title: Read and maintain Agentic Creative Campaigns
        when: ["agentic campaign status", "pause agentic", "plan tags", "attribution", "托管活动", "暂停托管"]
        steps:
          - agentic-campaign.get
          - agentic-campaign.plan-list
          - agentic-campaign.plan-get
          - agentic-campaign.plan-tags
          - agentic-campaign.plan-attribution
          - agentic-campaign.campaign-update: "Change the name by itself. Publish window and --publish-timezone may change while active; future not-yet-generated slots move to the new time."
          - agentic-campaign.plan-update
          - agentic-campaign.apply-spec: "Create or overwrite personas, topics, plans, members and a dated calendar from one spec file. Preview first, apply with the returned preview token."
          - agentic-campaign.plan-extra-post: "One more post on top of the daily one (e.g. a missed day). A manual ai-slideshow publish schedule on these accounts instead replaces that day's automatic post."
          - agentic-campaign.campaign-pause
          - agentic-campaign.campaign-activate
          - agentic-campaign.campaign-archive: "Stops every member account of every Plan."

  # ---------------------------------------------------------------------------
  - id: research
    title: "6. Research, analyze content and handle media"
    summary: >-
      Public evidence from the web, social platforms, communities and ad libraries; Hook
      analysis of Instagram posts; content analysis of videos; media upload and generation;
      shareable report artifacts.
    see: [safe-writes]
    tasks:
      - id: research-search
        title: Search the web, social platforms and communities
        when: ["research", "search", "competitor", "trend", "web search", "tiktok search", "reddit", "调研", "搜索", "竞品", "趋势"]
        steps:
          - research.search-web: "A query or URL; page text and the official site's visuals."
          - research.search-social-media: "--platform tiktok|instagram|youtube|xhs with an --intent."
          - research.search-community: "X, Reddit, LinkedIn."
          - research.analyze-visual: "Images or videos with a business prompt."
      - id: hook-analysis
        title: Analyze Instagram Hooks in batches
        when: ["hook", "hooks", "instagram hook", "reels hook", "钩子", "开头", "hook 分析"]
        steps:
          - research.check-hooks-analyzed: "Skip URLs analyzed before (up to 40)."
          - research.create-hook-analysis: "Post and/or profile URLs; stable --idempotency-key; returns at once."
          - research.submit-hook-candidates: "Your prefiltered candidates instead."
          - research.bulk-get-hook-analyses: "Poll up to 20 batches together."
          - research.get-hook-analysis
          - research.list-hook-analysis-results: "Structured evidence; scoring is your Skill's job."
          - research.get-hook-analysis-media: "Download one source video to --output."
      - id: ads-search
        title: Search ad libraries (Meta, TikTok)
        when: ["ads", "ad library", "competitor ads", "广告库", "竞品广告", "投放素材"]
        steps:
          - research.create-ads-search: "Durable task; stable idempotency key."
          - research.get-ads-search
          - research.list-ads-search-results
      - id: content-analysis
        title: Analyze a video or post (Content Analyzer)
        when: ["analyze video", "content analysis", "break down a video", "视频分析", "内容分析", "拆解视频"]
        steps:
          - content-analysis.run: "Platform content, uploaded media or a local file; optionally with a Business Skill."
          - content-analysis.get
          - content-analysis.list
      - id: media
        title: Upload, import or generate media
        when: ["upload", "upload file", "import image", "generate image", "generate video", "media", "上传", "生成图片", "生成视频", "素材上传"]
        steps:
          - media.upload: "Image, video, audio, or --media-type file (an artifact id, not a media id)."
          - media.import: "Images by URL only."
          - media.get
          - media.generate: "Keep the idempotency key; an unknown outcome is never retried with a new key."
          - media.get-generation: "Done only when completed and media_ready."
      - id: media-collections
        title: Group media into collections
        when: ["media collection", "album", "合集", "媒体合集"]
        steps:
          - media.collection-list
          - media.collection-get
          - media.collection-list-media
          - media.collection-create: "No idempotency key: after an unknown outcome, list first."
          - media.collection-update
          - media.collection-add: "Up to 100; ones already in it are skipped, so a rerun is safe."
          - media.collection-remove: "Media stay in the library."
          - media.collection-delete
      - id: artifacts
        title: Publish a report or file as an artifact
        when: ["artifact", "share report", "upload report", "public link", "报告", "分享链接", "上传报告"]
        steps:
          - artifacts.validate: "Before upload."
          - artifacts.upload: "Markdown is public by default."
          - artifacts.list
          - artifacts.get
          - artifacts.unshare: "Only when the user wants the public link revoked."
          - artifacts.share

  # ---------------------------------------------------------------------------
  - id: organization
    title: "7. Organization, Business Skills and routines"
    summary: >-
      Who is in the organization and its billing; the organization's HTML document
      library; its Business Skills (methodology the Agent loads before strategic work);
      routines that run work on a schedule.
    see: [organizations]
    tasks:
      - id: org-members
        title: Read members, roles and billing
        when: ["members", "roles", "who is in the org", "billing", "credits", "成员", "角色", "账单", "额度"]
        steps:
          - organization.member-list: "Role and Campaign scope per member (owner, admin, operator)."
          - organization.billing-get: "Plan, AI credits and usage (owner, admin)."
      - id: html-documents
        title: Upload and share HTML pages with customers
        when: ["html document", "html library", "upload html", "html folder", "share html", "HTML 文档", "文档库", "客户分享", "网页分享"]
        steps:
          - html-documents.list: "Museon staff only, plus asset read; the server decides. folder is omitted, root, or a folder id; q searches titles."
          - html-documents.folder-create: "One level only. The body is the name. No idempotency key: after an unknown outcome, list first."
          - html-documents.upload: "Public by default: give the customer share_url. --share-slug chooses a custom link name; --private keeps the document internal, even when a name is reserved. A second upload creates a second document; after an unknown result, list before retrying."
          - html-documents.share: "Enable sharing for an existing document. Omit link options to keep the custom name, --share-slug to rename, or --random-link to clear it. Old names stay reserved to this document."
          - html-documents.unshare: "Stop new visits through the current link. Sharing again restores the reserved custom name, or creates a new random link."
          - html-documents.install-defaults: "Copies the three built-in guides into this organization. A second call does not duplicate them."
      - id: business-skills
        title: Use or write the organization's Business Skills
        when: ["business skill", "methodology", "playbook", "业务技能", "方法论", "sop"]
        steps:
          - skills.list: "List before strategic, research, audit or onboarding work."
          - skills.get: "Load every directly relevant one."
          - skills.create: "Organization-private; --is-public needs admin."
          - skills.update
      - id: routines
        title: Schedule recurring work (routines)
        when: ["routine", "recurring", "every day", "schedule a job", "定时任务", "每天", "例行"]
        steps:
          - routines.list
          - routines.get
          - routines.create-draft: "For the user to review; no trigger yet."
          - routines.accept-draft
          - routines.create-ad-hoc: "Registers its trigger at once."
          - routines.rebuild-ad-hoc: "New instruction and trigger, memory copied."
          - routines.pause
          - routines.resume
          - routines.cancel
          - routines.get-memory
          - routines.record: "Write memory back; output is captured automatically."

unlisted:
  - match: "hireaicreator.*"
    reason: "HireAICreator (AI creators, video plans, test groups, warmup, delivery) has its own workflow; follow the museon-content-workflow-hireaicreator Skill and `museoncli schema hireaicreator`."
  - match: "staff-ops.*"
    reason: "MuseOn staff diagnostics (deployed code, logs, read-only tables); not for customer work."
