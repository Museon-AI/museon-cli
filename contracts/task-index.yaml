  # ---------------------------------------------------------------------------
  - id: tracking
    title: "2. Track content (content tracking Campaigns)"
    summary: >-
      A content tracking Campaign follows creators' and posts' performance without
      applications or review. Create it, add the creators and posts to track, read the
      numbers. Everything after creation takes the Campaign id (`data.campaign.id` of
      `campaign +create`, or `campaign +list --type tracking`) as --campaign-id.
    see: [ids, campaign-kinds]
    tasks:
      - id: tracking-create
        title: Create a tracking Campaign and add creators or posts
        when: ["tracking campaign", "track creators", "track posts", "monitor", "add creators", "add posts", "追踪", "监测", "添加达人", "添加帖子", "监控"]
        steps:
          - campaign.create: "--type tracking."
          - campaign.creator-add: "--url imports new creators by profile URL in the background (data.url_import_task); --creator-id attaches known social accounts. --wait reports each URL's outcome."
          - campaign.content-add: "--url imports posts by URL; --content-id attaches known ones. --wait reports each URL's outcome."
          - campaign.import-get: "An add is queued, not done: --id is its task id; failures list each URL it could not read."
          - campaign.creator-list: "data.items, the same shape for either kind of Campaign."
          - campaign.content-list
      - id: tracking-remove
        title: Stop tracking creators or posts
        when: ["remove creator", "remove post", "stop tracking", "删除追踪", "移除帖子", "移除达人"]
        before: Removing only changes the Campaign; the platform account or post is untouched.
        steps:
          - campaign.creator-remove: "--creator-id is the social account id; also drops its derived posts."
          - campaign.content-remove: "--collection-content-id, not the content id."
          - campaign.content-bulk-remove
      - id: tracking-performance
        title: Read a tracking Campaign's performance
        when: ["tracking performance", "views", "daily trend", "breakdown", "by creator tag", "source video", "追踪数据", "播放量", "趋势", "分组"]
        steps:
          - campaign.get-summary: "Daily totals in --timezone; observed deltas are snapshot sums, not platform plays per day."
          - campaign.get-period-performance: "Current period vs the one before."
          - campaign.list-dimensions: "What it can be broken down by."
          - campaign.get-breakdown: "--by creator-tag or source-video for tracking Campaigns."
          - campaign.content-list: "The posts behind a number, same window and timezone."
          - campaign.creator-tag-list
      - id: account-and-post-history
        title: Read one account's or one post's synced history
        when: ["creator history", "account history", "post performance", "post history", "resolve post", "账号历史", "帖子数据", "单帖"]
        before: This is Museon's synced store, not a live platform fetch.
        steps:
          - campaign.creator-get: "--creator-id is the social account id."
          - campaign.post-list: "--creator-id is the social account id."
          - campaign.creator-get-performance: "--date-from and --date-to both required, at most 180 days."
          - campaign.post-get: "--content-id is the post's content_id."
          - campaign.post-get-performance
          - campaign.post-resolve: "A publish schedule item → the post it became."
        see: [creator-ids]

