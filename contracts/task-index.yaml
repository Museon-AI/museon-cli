    tasks:
      - id: dashboard
        title: Read a UGC Campaign's Dashboard
        when: ["dashboard", "campaign performance", "kpi", "content tab", "videos", "creators tab", "audience", "看板", "活动数据", "数据", "视频列表", "受众"]
        steps:
