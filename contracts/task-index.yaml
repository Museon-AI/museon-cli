        when: ["which format performs best", "breakdown", "compare briefs", "persona comparison", "tag comparison", "哪个脚本好", "对比", "分组对比", "人设对比"]
        before: Report the unassigned and awaiting-review buckets before any per-brief number; compare on median views with the post count beside it.
        steps:
