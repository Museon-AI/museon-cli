  - id: analytics
    title: "3. Read Campaign analytics and boards"
    summary: >-
      The web Campaign Dashboard, tab by tab, keyed by the Campaign id; breakdowns
      by Format, persona and tag; the organization's analytics; multi-Campaign boards. Say
      which window, timezone and post scope (approved or all) every number uses.
